name: CI
on:
    push:
        branches:
            - main
        tags: ["*"]
    pull_request:
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
# Temporary: go straight to the General registry instead of through a package server.
#
# `AbstractNeuralNetworks` 0.7.0 was registered at 04:00 UTC on 2026-08-23, `SymbolicNeuralNetworks`
# 0.6.0 at 16:11, and the package servers were still serving a registry that stopped at ANN 0.6.4
# and SNN 0.5.0 a day later — so every job here died in `Pkg.resolve` ("possible versions are:
# 0.1.0 - 0.6.4 ... restricted to versions 0.7 by NonlinearIntegrators") before running a single
# test. An empty `JULIA_PKG_SERVER` makes Pkg clone the registry over git and fetch packages from
# their own repositories, which resolves the same environment that resolves locally.
#
# The cost is speed: no CDN and no registry tarball. Remove this once the package servers have
# caught up, and check that rather than assuming it: a server's `/meta` reports a
# `last_registry_update` that is a heartbeat, not the content date, so compare the registry it
# actually serves against General.
#
#   curl -sSL https://pkg.julialang.org/registries
#   curl -sSL -o reg.tar.gz https://pkg.julialang.org/registry/<uuid>/<hash> \
#     && tar xzf reg.tar.gz && tail -3 A/AbstractNeuralNetworks/Versions.toml
#
# Same block in `Documenter.yml`; `SymbolicNeuralNetworks` carries it too.
env:
  JULIA_PKG_SERVER: ""
jobs:
    test:
        name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
        runs-on: ${{ matrix.os }}
        continue-on-error: ${{ matrix.experimental }}
        strategy:
            fail-fast: false
            matrix:
                version:
                    - "1.10"
                    - "1.12"
                    - "^1.13.0-0"
                os:
                    - ubuntu-latest
                    - macOS-latest
                    - windows-latest
                arch:
                    - default
                experimental: [false]
                include:
                    - version: "nightly"
                      os: ubuntu-latest
                      arch: default
                      experimental: true
                    - version: "nightly"
                      os: macOS-latest
                      arch: default
                      experimental: true
                    - version: "nightly"
                      os: windows-latest
                      arch: default
                      experimental: true
        steps:
            - uses: actions/checkout@v7
            - uses: julia-actions/setup-julia@v3
              with:
                  version: ${{ matrix.version }}
                  arch: ${{ matrix.arch }}
            - name: Set environment variables
              run: echo "JULIA_NUM_THREADS=2" >> $GITHUB_ENV
            - uses: julia-actions/cache@v3
            - uses: julia-actions/julia-buildpkg@v1
            # Coverage is collected and uploaded from exactly one job — Linux on the oldest
            # supported Julia. Twelve jobs measuring the same source produced twelve uploads of
            # the same numbers, and every extra one was a chance to fail on something unrelated
            # to the tests: `CoverageTools.process_cov` reads each line of a `.cov` file as
            # `line[1:9]` with no length guard, so a single short or empty line aborts the step
            # after the tests have already passed. That is what took down `^1.13.0-0 - macOS`
            # in run 31497754170 while the same commit's `^1.13.0-0` ubuntu and windows jobs
            # were green.
            #
            # Instrumentation also costs runtime, so the other eleven jobs now run without it.
            - uses: julia-actions/julia-runtest@v1
              with:
                  coverage: ${{ matrix.version == '1.10' && matrix.os == 'ubuntu-latest' }}
            - uses: julia-actions/julia-processcoverage@v1
              if: matrix.version == '1.10' && matrix.os == 'ubuntu-latest'
            - uses: codecov/codecov-action@v7
              if: matrix.version == '1.10' && matrix.os == 'ubuntu-latest'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
              with:
                  files: lcov.info
            - name: Instantiate docs environment
              run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
            - name: Run doctests
              shell: julia --project=docs --color=yes {0}
              run: |
                  using Documenter: DocMeta, doctest
                  using NonlinearIntegrators
                  DocMeta.setdocmeta!(NonlinearIntegrators, :DocTestSetup, :(using NonlinearIntegrators); recursive=true)
                  doctest(NonlinearIntegrators)
