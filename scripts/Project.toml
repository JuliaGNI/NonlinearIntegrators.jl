# The environment for `scripts/`. The experiment harness — `run_*.jl`, `figures.jl` — needs
# CairoMakie, CompactBasisFunctions, GeometricIntegrators, GeometricIntegratorsBase,
# GeometricProblems, GeometricSolutions, JLD2, NonlinearIntegrators, Printf, QuadratureRules,
# SimpleSolvers and Symbolics, all of which were already here: it arrived without adding a single
# dependency.
#
# **No `Plots`.** CairoMakie is the one plotting backend here, as everywhere in this tree. The last
# user was `vise_plot.jl`, which loaded Plots *alongside* CairoMakie — so a bare `plot` was
# ambiguous between the two and could not resolve at all — and its handful of Plots calls are now
# `lines`/`compare_discovered`.
#
# `SymbolicUtils` is here for `vise_plot.jl` alone; `Pkg`, `BSplineKit` and `StaticArrays` for
# `test_CGVI_BSpline.jl`. Both are retained files rather than current ones.
#
# **`vise_plot.jl` still cannot run here**: it also needs `MLJ` and `SymbolicRegression`, which are
# deliberately not added — two heavy dependencies for a file kept as the record of how the VISE
# ansätze were discovered, not as a script anyone runs.

[deps]
BSplineKit = "093aae92-e908-43d7-9660-e50ee39d5a0a"
CairoMakie = "13f3f980-e62b-5c42-98c6-ff1f3baf88f0"
Colors = "5ae59095-9a9b-59fe-a467-6f913c188581"
CompactBasisFunctions = "a09551c4-f815-4143-809e-dd1986753ba7"
FastGaussQuadrature = "442a2c76-b920-505d-bb47-c5924d526838"
ForwardDiff = "f6369f11-7733-5829-9624-2563aa707210"
GeometricIntegrators = "dcce2d33-59f6-5b8d-9047-0defad88ae06"
GeometricIntegratorsBase = "71212ab4-08a2-48eb-a02b-4cbad0e9c44a"
GeometricProblems = "18cb22b4-ad41-5c80-9c5f-710df63fbdc9"
GeometricSolutions = "7843afe4-64f4-4df4-9231-049495c56661"
JLD2 = "033835bb-8acc-5ee8-8aae-3f567f8a3819"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
NonlinearIntegrators = "4ad56de4-0342-4c02-9694-ab2f23251d8c"
Pkg = "44cfe95a-1eb2-52ea-b672-e2afdf69b78f"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
QuadratureRules = "a08977f5-a20d-4b99-b11f-f5ea535e0575"
SimpleSolvers = "36b790f5-6434-4fbe-b711-1f64a1e2f6a2"
StaticArrays = "90137ffa-7385-5640-81b9-e52037218182"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
SymbolicUtils = "d1185830-fcd6-423d-90d6-eec64667417b"
Symbolics = "0c5d862f-8b57-4792-8d23-62f2024744c7"

[compat]
# Not housekeeping: `NonlinearIntegrators` requires `SimpleSolvers` 0.13.2 through
# `GeometricOptimizers` 0.7, and `GeometricIntegrators` 0.18.2/0.18.3 both cap `SimpleSolvers` at
# 0.12.1. The resolver derives this bound on its own — it cannot silently pick 0.18.2, it simply
# fails — so this entry documents the constraint rather than creating it.
GeometricIntegrators = "0.18.4"

[sources]
NonlinearIntegrators = {path = ".."}
