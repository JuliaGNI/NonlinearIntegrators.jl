# Test-only dependencies.
#
# These used to live in the package's own `[extras]`/`[targets]` block. Aqua and JET are
# analysis tools with their own dependency trees, and putting them there would make them part
# of the resolution problem for anyone installing NonlinearIntegrators. A `test/Project.toml`
# keeps them out of the package's dependency graph entirely.
#
# NonlinearIntegrators itself is deliberately *not* listed: `Pkg.test` puts the package under
# test into this environment automatically. Adding it by hand (e.g. with `Pkg.develop`) also
# writes a `[sources]` entry and a `test/Manifest.toml`, which pins the whole dependency tree
# and defeats the point of the CI version matrix.

[deps]
AbstractNeuralNetworks = "60874f82-5ada-4c70-bd1c-fa6be7711c8a"
Aqua = "4c88cf16-eb10-579e-8560-4a9242c79595"
# For the `BFloat16` rows of the `network_inputs` testset in `integration/methods_smoke.jl`.
BFloat16s = "ab4f0b2a-ad5b-11e8-123f-65d77653426b"
# Loading a backend is what activates the `Makie` weakdep, and with it the
# `NonlinearIntegratorsPlots` extension. CairoMakie and not GLMakie: it needs neither a GPU nor a
# display, so it is the backend that works in CI.
CairoMakie = "13f3f980-e62b-5c42-98c6-ff1f3baf88f0"
CompactBasisFunctions = "a09551c4-f815-4143-809e-dd1986753ba7"
ForwardDiff = "f6369f11-7733-5829-9624-2563aa707210"
GeometricBase = "9a0b12b7-583b-4f04-aa1f-d8551b6addc9"
# For the assertion in `plots.jl` that names the problem type of a solution.
GeometricEquations = "c85262ba-a08a-430a-b926-d29770767bf2"
GeometricIntegratorsBase = "71212ab4-08a2-48eb-a02b-4cbad0e9c44a"
GeometricProblems = "18cb22b4-ad41-5c80-9c5f-710df63fbdc9"
GeometricSolutions = "7843afe4-64f4-4df4-9231-049495c56661"
JET = "c3a54625-cd67-489e-a8e7-0a5a0ff4e31b"
# For `scripts_archives_tests.jl`, which includes `scripts/archives.jl` — the option parser and the
# archive schema helpers are tested here. That file loads JLD2 to read and write archives, and
# Printf below for its progress reporting; both have to be declared, or the `include` fails to
# resolve them and the whole suite errors out before any testset runs.
JLD2 = "033835bb-8acc-5ee8-8aae-3f567f8a3819"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Logging = "56ddb016-857b-54e1-b83d-db4d58db5568"
NeuralNetworkParameters = "67f4d93a-60e9-472b-8cdd-1ccf6005724a"
# The other half of `scripts/archives.jl`'s load, with JLD2 above.
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
QuadratureRules = "a08977f5-a20d-4b99-b11f-f5ea535e0575"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
SafeTestsets = "1bc83da4-3b8d-516f-aca4-4fe02f6d838f"
SimpleSolvers = "36b790f5-6434-4fbe-b711-1f64a1e2f6a2"
Symbolics = "0c5d862f-8b57-4792-8d23-62f2024744c7"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[compat]
# 0.8.2 is the first release whose persistent-tasks check adds `@stdlib` to the load path of its
# precompilation subprocess. Under `Pkg.test` that load path is only the package and `test/`, so
# with 0.8.0 the subprocess cannot load `Pkg` and the check fails.
Aqua = "0.8.2"
# 0.6.1 is the first release that keeps the native `bfloat` type off aarch64 below LLVM 19. With
# 0.6.0 on Julia 1.12 (LLVM 18) on aarch64, LLVM aborts on `-(::BFloat16)` ("Cannot select ...
# fneg") in the `network_inputs` testset.
BFloat16s = "0.6.1"
CairoMakie = "0.15"
GeometricProblems = "0.9.1"
# On Julia 1.12, JLD2 0.4.28 (the oldest release the resolve admits), 0.4.46 to 0.4.53 and 0.5.0
# to 0.5.7 fail to precompile, and 0.4.54 and 0.5.8 to 0.5.11 deadlock in `load`. 0.4.55 and
# 0.5.12 are the first releases of their series that write and read an archive.
JLD2 = "0.4.55, 0.5.12 - 0.6"
# 0.10.1 is the first release whose captured-variable pass strips `LimitedAccuracy` from an
# inferred type before `widenconst`. 0.10.0 throws "unhandled LimitedAccuracy" on the
# `ShallowNetAutodiff` cases of `jet.jl`.
JET = "0.10.1, 0.11, 0.12"
Logging = "1"
SafeTestsets = "0.1"
Test = "1"
